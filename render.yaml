services:
  - type: web
    name: smartfarm-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: smartfarm
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
