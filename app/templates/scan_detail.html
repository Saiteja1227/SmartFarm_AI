{% extends "base.html" %}
{% block title %}Scan Report — SmartFarm AI{% endblock %}

{% block content %}
<div class="container-xl px-4 py-5">

  <a href="/history" class="sf-btn-outline d-inline-flex align-items-center gap-2 mb-5">
    <i class="bi bi-arrow-left" aria-hidden="true"></i>
    <span data-i18n="detail.back">Back to history</span>
  </a>

  <!-- Loading -->
  <div id="detail-loading" class="d-flex align-items-center gap-3 text-muted">
    <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
    <span data-i18n="detail.loading">Loading report…</span>
  </div>

  <!-- Error -->
  <div id="detail-error" class="d-none text-danger" data-i18n="detail.notFound">Scan not found</div>

  <!-- Report container -->
  <div id="report-container" data-testid="report-container" class="d-none"></div>

</div>
{% endblock %}

{% block scripts %}
<script>
  // Expose scan ID to JS
  window.SCAN_ID = {{ scan_id | tojson }};
</script>
<script src="{{ url_for('static', filename='js/pdf.js') }}?v=4.1"></script>
<script src="{{ url_for('static', filename='js/report.js') }}?v=4.1"></script>
<script src="{{ url_for('static', filename='js/scan_detail.js') }}?v=4.1"></script>
{% endblock %}
