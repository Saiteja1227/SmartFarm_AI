<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Administrator Sign In — SmartFarm AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=4.1" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(28, 58, 39, 0.08), transparent 55%),
                  var(--sf-background, #f4f1eb);
    }
    .admin-login-card {
      max-width: 440px;
      width: 100%;
      margin: 2rem auto;
      background: var(--sf-card, #fbf9f5);
      border: 1px solid var(--sf-border, #e2ddd3);
      border-radius: 6px;
      box-shadow: 0 18px 40px -16px rgba(28, 58, 39, 0.16);
    }
    .admin-lock-badge {
      width: 48px;
      height: 48px;
      background: var(--sf-primary, #1c3a27);
      color: #f4f1eb;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>
  <div class="container px-3">
    <div class="admin-login-card p-4 p-sm-5" data-testid="admin-login-card">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="admin-lock-badge">
          <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
        </div>
        <span class="font-mono small text-uppercase px-2 py-1 rounded-1"
              style="background:rgba(28,58,39,0.09);color:var(--sf-primary);font-size:0.72rem;letter-spacing:0.08em">
          Private Owner Access
        </span>
      </div>

      <p class="sf-overline mb-1">SmartFarm AI</p>
      <h1 class="font-serif h2 text-primary mb-2">Administrator Sign In</h1>
      <p class="small text-muted mb-4">
        Restricted to the project owner. Enter your administrator credentials to access the Scan History Dashboard.
      </p>

      {% if error %}
      <div class="alert alert-danger d-flex align-items-start gap-2 py-2 px-3 small rounded-1 mb-4"
           role="alert" data-testid="admin-login-error">
        <i class="bi bi-exclamation-octagon-fill mt-1" aria-hidden="true"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('admin.admin_login') }}" autocomplete="off" data-testid="admin-login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <div class="mb-3">
          <label for="admin-username" class="form-label small fw-semibold text-uppercase" style="letter-spacing:0.05em">
            Admin Username
          </label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
              <i class="bi bi-person-badge" aria-hidden="true"></i>
            </span>
            <input type="text"
                   id="admin-username"
                   name="username"
                   required
                   autofocus
                   autocomplete="username"
                   data-testid="admin-username-input"
                   class="form-control border-start-0 ps-0"
                   placeholder="Enter admin username" />
          </div>
        </div>

        <div class="mb-4">
          <label for="admin-password" class="form-label small fw-semibold text-uppercase" style="letter-spacing:0.05em">
            Admin Password
          </label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
              <i class="bi bi-key" aria-hidden="true"></i>
            </span>
            <input type="password"
                   id="admin-password"
                   name="password"
                   required
                   autocomplete="current-password"
                   data-testid="admin-password-input"
                   class="form-control border-start-0 border-end-0 ps-0"
                   placeholder="Enter admin password" />
            <button class="btn btn-outline-secondary border-start-0"
                    type="button"
                    id="toggle-pw-btn"
                    aria-label="Toggle password visibility"
                    onclick="var p=document.getElementById('admin-password'),i=document.getElementById('toggle-pw-icon');if(p.type==='password'){p.type='text';i.className='bi bi-eye-slash';}else{p.type='password';i.className='bi bi-eye';}">
              <i class="bi bi-eye" id="toggle-pw-icon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit"
                data-testid="admin-login-submit"
                class="sf-btn-primary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i class="bi bi-lock-fill" aria-hidden="true"></i>
          <span>Sign In to Admin Dashboard</span>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
